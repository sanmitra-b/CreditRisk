services:
  db:
    image: pgvector/pgvector:pg17
    container_name: neostats-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-credit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  init-db:
    build: .
    container_name: neostats-init-db
    command: >
      sh -c "python -m scripts.load_postgres && python -m src.db.knowledge_base"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit_app}:${POSTGRES_PASSWORD:-credit_app_dev}@db:5432/${POSTGRES_DB:-credit_risk}
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_user:${ANALYTICS_PASSWORD:-analytics_dev}@db:5432/${POSTGRES_DB:-credit_risk}
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-credit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_app_dev}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-analytics_dev}
      DATA_DIR: /app/data
      MODEL_DIR: /app/models
      ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: neostats-streamlit
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit_app}:${POSTGRES_PASSWORD:-credit_app_dev}@db:5432/${POSTGRES_DB:-credit_risk}
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_user:${ANALYTICS_PASSWORD:-analytics_dev}@db:5432/${POSTGRES_DB:-credit_risk}
      POSTGRES_DB: ${POSTGRES_DB:-credit_risk}
      POSTGRES_USER: ${POSTGRES_USER:-credit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_app_dev}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-analytics_dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_COMPLEX_MODEL: ${GEMINI_COMPLEX_MODEL:-gemini-3.8-flash}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-8000}
      MAX_SQL_ROWS: ${MAX_SQL_ROWS:-200}
      DATA_DIR: /app/data
      MODEL_DIR: /app/models
      ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
